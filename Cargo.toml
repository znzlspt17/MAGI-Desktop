[workspace]
resolver = "2"
members = ["crates/magi-core", "crates/magi-inference", "crates/magi-transport", "crates/magi-provider"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
