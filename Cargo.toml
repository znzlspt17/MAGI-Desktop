[workspace]
resolver = "2"
members = ["crates/core", "crates/inference", "crates/transport", "crates/provider", "crates/engine", "crates/integrations", "crates/desktop"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
